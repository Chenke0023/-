name: Daily News Filter

on:
  schedule:
    - cron: "0 0 * * *"  # 08:00 Asia/Shanghai
    - cron: "0 6 * * *"  # 14:00 Asia/Shanghai
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Run tests
        run: pytest

      - name: Build reported keys for cross-run dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          REPORT_HISTORY_DAYS = int(os.environ.get("REPORT_HISTORY_DAYS", "3"))
          cutoff = datetime.now(timezone.utc) - timedelta(days=REPORT_HISTORY_DAYS)

          def normalize_news_url(url: str) -> str:
              raw = (url or "").strip()
              if not raw:
                  return ""
              parsed = urlsplit(raw)
              query_pairs = []
              tracking_keys = {
                  "feature",
                  "fbclid",
                  "gclid",
                  "mc_cid",
                  "mc_eid",
                  "mkt_tok",
                  "ref",
                  "source",
                  "spm",
              }
              for key, value in parse_qsl(parsed.query, keep_blank_values=True):
                  lowered = key.lower()
                  if lowered.startswith("utm_") or lowered in tracking_keys:
                      continue
                  query_pairs.append((key, value))
              path = parsed.path.rstrip("/") or parsed.path
              return urlunsplit(
                  (
                      parsed.scheme.lower(),
                      parsed.netloc.lower(),
                      path,
                      urlencode(query_pairs, doseq=True),
                      "",
                  )
              )

          def key_for_url(url: str) -> str:
              n = normalize_news_url(url)
              return f"url:{n}" if n else ""

          def gh_json(args: list[str]) -> list[dict]:
              out = subprocess.check_output(["gh", *args], text=True)
              return json.loads(out)

          issues = gh_json(
              [
                  "issue",
                  "list",
                  "-R",
                  "${{ github.repository }}",
                  "--state",
                  "open",
                  "--label",
                  "daily-report",
                  "--limit",
                  "30",
                  "--json",
                  "createdAt,body",
              ]
          )

          url_re = re.compile(r"https?://[^\s\)\]\>\"']+")
          keys = set()
          for it in issues:
              created_at = it.get("createdAt", "")
              if not isinstance(created_at, str) or not created_at:
                  continue
              try:
                  dt = datetime.fromisoformat(created_at.replace("Z", "+00:00")).astimezone(timezone.utc)
              except ValueError:
                  continue
              if dt < cutoff:
                  continue
              body = it.get("body") or ""
              if not isinstance(body, str):
                  continue
              for url in url_re.findall(body):
                  k = key_for_url(url)
                  if k:
                      keys.add(k)

          payload = {"generated_at": datetime.now(timezone.utc).isoformat(), "keys": sorted(keys)}
          with open("reported_keys.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print(f"Built {len(keys)} reported keys")
          PY

      - name: Run filter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://integrate.api.nvidia.com' }}
          MODEL_NAME: ${{ secrets.MODEL_NAME || 'moonshotai/kimi-k2-instruct' }}
          BATCH_SIZE: ${{ secrets.BATCH_SIZE || '50' }}
          BATCH_DELAY: ${{ secrets.BATCH_DELAY || '70' }}
          REQUEST_DELAY: ${{ secrets.REQUEST_DELAY || '0.2' }}
          REPORTED_KEYS_FILE: reported_keys.json
        run: python batch_process_railway.py

      - name: Pick output files
        id: out
        shell: bash
        run: |
          set -euo pipefail
          md=$(ls -1t 相关新闻_*.md 2>/dev/null | head -n 1 || true)
          js=$(ls -1t filtered_news_*.json 2>/dev/null | head -n 1 || true)
          unk=$(ls -1t unknown_news_*.json 2>/dev/null | head -n 1 || true)
          echo "md=$md" >> "$GITHUB_OUTPUT"
          echo "json=$js" >> "$GITHUB_OUTPUT"
          if [ -n "$unk" ]; then
            echo "unknown=$unk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build issue body
        id: body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import textwrap

          md_path = pathlib.Path(os.environ["MD_PATH"]).resolve()
          js_path = pathlib.Path(os.environ["JSON_PATH"]).resolve()
          unk_raw = os.environ.get("UNKNOWN_PATH", "")
          unk_path = pathlib.Path(unk_raw).resolve() if unk_raw else None
          md = md_path.read_text(encoding="utf-8", errors="replace")

          max_chars = 60000
          if len(md) > max_chars:
              md = md[:max_chars] + "\n\n... (truncated)\n"

          run_url = os.environ.get("RUN_URL", "")

          unknown_line = ""
          if unk_path and unk_path.exists():
              unknown_line = f"- Unknown: `{unk_path.name}`\n"

          body = textwrap.dedent(f"""\
          Automated daily run finished.

          - Markdown: `{md_path.name}`
          - JSON: `{js_path.name}`
          {unknown_line}- Run: {run_url}

          ---

          {md}
          """)

          pathlib.Path("issue_body.txt").write_text(body, encoding="utf-8")
          PY
        env:
          MD_PATH: ${{ steps.out.outputs.md }}
          JSON_PATH: ${{ steps.out.outputs.json }}
          UNKNOWN_PATH: ${{ steps.out.outputs.unknown }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Create issue with timestamp
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const now = new Date();
            const dateStr = now.toLocaleString('zh-CN', { 
              timeZone: 'Asia/Shanghai', 
              year: 'numeric', 
              month: '2-digit', 
              day: '2-digit', 
              hour: '2-digit', 
              minute: '2-digit', 
              hour12: false 
            }).replace(/\//g, '-');
            
            const title = `Daily News Filter Result - ${dateStr}`;
            const body = fs.readFileSync('issue_body.txt', 'utf8');
            const { owner, repo } = context.repo;

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['daily-report']
            });
            core.info(`Created issue #${created.data.number}: ${title}`);

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: news-result
          if-no-files-found: ignore
          path: |
            ${{ steps.out.outputs.md }}
            ${{ steps.out.outputs.json }}
            unknown_news_*.json
