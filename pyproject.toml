[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "worktrees"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501", "F541", "I001", "UP015", "UP017"]

[tool.pytest.ini_options]
pythonpath = ["."]
